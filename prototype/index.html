<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ribbon — carousel review</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#efefeb;color:#242621;font-family:Arial,sans-serif}
    header{padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #d5d6ce}
    h1{font-size:16px;font-weight:500;margin:0}header p{font-size:12px;color:#72766a;margin:5px 0 0}
    nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}button,select,a{font:inherit;font-size:12px;color:inherit}nav button,select{padding:8px 12px;border:1px solid #c7cabf;background:transparent;border-radius:6px;cursor:pointer}
    button[aria-pressed=true]{background:#26352a;color:white}main{padding:24px}#host{height:calc(100svh - 164px);min-height:340px;width:100%;margin:auto;background:#d8d8d8;transition:width .2s;overflow:hidden;border-radius:12px}
    footer{padding:0 28px 20px;display:flex;justify-content:space-between;font-size:12px;color:#656b5e;gap:12px}
    @media(max-width:620px){header{padding:16px;align-items:flex-start;flex-direction:column;gap:12px}main{padding:12px}#host{height:65svh}footer{padding:0 16px 16px}}
    #tuning{display:none;min-width:0;max-height:calc(100svh - 170px);overflow:auto;--tp-base-font-family:Arial,sans-serif;--tp-base-font-size:12px}#stage{min-width:0}
    .tuning-open main{display:grid;grid-template-columns:minmax(0,1fr)300px;gap:20px}.tuning-open #tuning{display:block}
    .tuning-note{font-size:12px;line-height:1.5;color:#656b5e;margin:12px 4px}
    .settings-dialog{border:1px solid #aaa;border-radius:10px;width:min(620px,90vw);background:#efefeb;color:#242621}.settings-dialog::backdrop{background:#0007}
    .settings-dialog h2{font-size:18px}.settings-dialog p{font-size:13px}.settings-dialog textarea{width:100%;height:50vh;font:12px monospace;resize:vertical}.settings-dialog form{margin-top:12px;text-align:right}
    @media(max-width:900px){.tuning-open main{grid-template-columns:minmax(0,1fr)}#tuning{max-height:none}}
  </style>
</head>
<body class="tuning-open">
  <header><div><h1>Ribbon / carousel review</h1><p>03 — shader titles and live tuning. Copy settings to share your adjustments.</p></div>
    <nav aria-label="Review settings"><button id="toggle-tuning" aria-expanded="true" aria-controls="tuning">Tune</button><button id="replay">Replay intro</button><button data-count="3">3 cards</button><button data-count="12" aria-pressed="true">12 cards</button><button data-count="20">20 cards</button><select id="gap" aria-label="Angular gap between cards"><option value="0.5">0.5° gap</option><option value="1" selected>1° gap</option><option value="2">2° gap</option><option value="3">3° gap</option><option value="5">5° gap</option></select><select id="size" aria-label="Container size"><option value="100%">Full width</option><option value="390px">Phone width</option><option value="700px">700px container</option></select><button id="motion" aria-pressed="true">Auto rotate</button></nav>
  </header>
  <main><div id="stage"><div id="host"></div></div><aside id="tuning" aria-label="Carousel tuning controls"></aside></main>
  <footer><span>Drag to rotate · Click a card to open · Escape to close</span><a href="/" target="_blank" rel="noopener">Original reference ↗</a></footer>
  <script type="module" src="/prototype/review.ts"></script>
</body>
</html>
